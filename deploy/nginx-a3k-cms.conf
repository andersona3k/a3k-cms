# A3K CMS — proxy reverso. Copie para /etc/nginx/sites-available/a3k-cms
# e faça o symlink em sites-enabled. Na VM externa, o certbot reescreve este
# arquivo adicionando o bloco 443 + redirect.

server {
    listen 80;
    listen [::]:80;
    server_name _;            # troque pelo domínio na VM externa

    # upload de vídeo (POST /api/assets)
    client_max_body_size 2g;

    # mídia servida direto do disco (não passa pelo Node)
    location /assets/ {
        alias /opt/a3k-cms/media/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;           # uploads/transcode longos
        proxy_buffering off;               # manifest/preview em tempo real
    }
}
