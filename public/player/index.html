<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>A3K Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* orientacao (giro + espelho) aplicada por JS inline em #stage e #status */
  #stage {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    transform-origin: top left;
  }
  #stage > * {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  /* cobre a troca de midia: preto por cima enquanto o proximo item carrega,
     some quando ele comeca a tocar/renderizar. Mata o "botao de play". */
  #cover {
    position: fixed; inset: 0; background: #000; z-index: 5;
    opacity: 0; pointer-events: none; transition: opacity 220ms ease;
  }
  #cover.on { opacity: 1; transition: none; }  /* entra instantaneo, sai suave */
  #status {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    color: #cfd8e3; font: 16px/1.4 system-ui, sans-serif; text-align: center; padding: 24px;
    transform-origin: top left; box-sizing: border-box;
  }
  #status .serial {
    font: 700 34px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 3px; color: #fff; background: #111a24;
    border: 1px solid #24384a; border-radius: 12px; padding: 16px 24px;
  }
  #status small { color: #6b7d8f; }
  .hidden { display: none !important; }
  #badge {
    position: fixed; right: 8px; bottom: 6px; color: #33465a;
    font: 11px/1 ui-monospace, monospace; z-index: 10;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="cover"></div>
  <div id="status">
    <div>A3K Digital Signage</div>
    <div class="serial" id="serial">…</div>
    <div id="statusMsg">Pareando…</div>
    <small id="statusHint"></small>
  </div>
  <div id="badge"></div>

<script>
(function () {
  'use strict';

  var PLAYER_VERSION = '2026-08-28.7';
  var API = location.origin;
  var POLL_MS = 15000;
  var HEARTBEAT_MS = 60000;

  var LS = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  var stage = document.getElementById('stage');
  var cover = document.getElementById('cover');
  var statusEl = document.getElementById('status');
  var serialEl = document.getElementById('serial');
  var statusMsg = document.getElementById('statusMsg');
  var statusHint = document.getElementById('statusHint');
  var badge = document.getElementById('badge');

  function urlParam(name) {
    var m = new RegExp('[?#&]' + name + '=([^&#]+)').exec(location.href);
    return m ? decodeURIComponent(m[1]) : null;
  }

  var device = {
    id: LS.get('a3k_device_id'),
    token: LS.get('a3k_token'),
    serial: LS.get('a3k_serial'),
    hardwareId: LS.get('a3k_hw') || null,
  };

  // Identidade fisica injetada pelo app nativo (?hw=). Tem prioridade sobre o
  // valor salvo: se mudou (ex.: imagem de disco clonada para outro aparelho),
  // descarta o pareamento antigo e pareia de novo com o hw real.
  var injectedHw = urlParam('hw');
  if (injectedHw && injectedHw !== device.hardwareId) {
    LS.set('a3k_device_id', ''); LS.set('a3k_token', ''); LS.set('a3k_serial', '');
    device.id = null; device.token = null; device.serial = null;
    device.hardwareId = injectedHw;
    LS.set('a3k_hw', injectedHw);
  }
  if (!device.hardwareId) {
    device.hardwareId =
      (self.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'hw-' + Date.now() + '-' + Math.random().toString(16).slice(2);
    LS.set('a3k_hw', device.hardwareId);
  }

  // codigo de pareamento (fluxo "Add player"): da URL (?code= ou #code=) ou salvo.
  // so vale enquanto o device ainda nao tem token.
  function pairCode() {
    var fromUrl = urlParam('code');
    if (fromUrl) LS.set('a3k_code', fromUrl);
    return device.token ? null : (fromUrl || LS.get('a3k_code') || null);
  }

  var currentVersion = -1;
  var currentPlaylistId = -1;
  var allItems = [];   // tudo que veio no manifest
  var playlist = [];    // subconjunto no ar agora (day-parting)
  var idx = 0;
  var advanceTimer = null;
  var activeSig = '';   // assinatura do subconjunto ativo, p/ detectar mudanca
  var manifestName = null;
  var plRotation = 0, plMirror = 0;   // orientacao padrao da playlist

  // ---- day-parting: espelha src/lib/schedule.js, avaliado no relogio local ----
  function schedToMinutes(hhmm) {
    var m = /^(\d{1,2}):([0-5]\d)$/.exec(String(hhmm).trim());
    if (!m) return null;
    var h = +m[1], mi = +m[2];
    if (h > 24 || (h === 24 && mi !== 0)) return null;
    return h * 60 + mi;
  }
  function isoDay(d) { return ((d.getDay() + 6) % 7) + 1; }
  function ymd(d) {
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function scheduleActive(s, date) {
    if (s == null) return true;
    if (typeof s === 'string') { try { s = JSON.parse(s); } catch (e) { return true; } if (s == null) return true; }
    var d = date || new Date();
    var day = ymd(d);
    if (s.from && day < s.from) return false;
    if (s.until && day > s.until) return false;
    var start = s.start ? schedToMinutes(s.start) : 0;
    var end = s.end ? schedToMinutes(s.end) : 1440;
    if (end === 0) end = 1440;
    var now = d.getHours() * 60 + d.getMinutes();
    var days = (s.days && s.days.length) ? s.days : null;
    var today = isoDay(d), yesterday = ((today + 5) % 7) + 1;
    if (start <= end) {
      return (now >= start && now < end) && (!days || days.indexOf(today) >= 0);
    }
    if (now >= start) return !days || days.indexOf(today) >= 0;
    if (now < end) return !days || days.indexOf(yesterday) >= 0;
    return false;
  }

  function detectPlayerType() {
    var ua = navigator.userAgent;
    if (/Tizen/i.test(ua)) return 'tizen';
    if (/Web0S|webOS|LG Browser/i.test(ua)) return 'webos';
    if (/Android/i.test(ua)) return 'android';
    if (/Windows/i.test(ua)) return 'windows';
    return 'unknown';
  }

  function setStatus(msg, hint) {
    statusMsg.textContent = msg || '';
    statusHint.textContent = hint || '';
  }
  function showStatus(show) { statusEl.classList.toggle('hidden', !show); }

  function pair() {
    setStatus('Pareando…');
    var body = {
      hardware_id: device.hardwareId,
      player_type: detectPlayerType(),
      name: null,
    };
    var code = pairCode();
    if (code) body.code = code;
    return fetch(API + '/api/pair/new', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.token) throw new Error(d && d.error ? d.error : 'pair falhou');
        device.id = String(d.deviceId);
        device.token = d.token;
        device.serial = d.serial;
        LS.set('a3k_device_id', device.id);
        LS.set('a3k_token', device.token);
        LS.set('a3k_serial', device.serial);
        LS.set('a3k_code', ''); // consumido
        serialEl.textContent = device.serial;
      });
  }

  function auth() { return { authorization: 'Bearer ' + device.token }; }

  function fetchManifest() {
    var url = API + '/api/devices/' + device.id + '/manifest?v=' + currentVersion +
      '&p=' + currentPlaylistId;
    return fetch(url, { headers: auth() }).then(function (r) {
      if (r.status === 304) return null;
      if (r.status === 401 || r.status === 403) {
        // token perdeu a validade — reparear.
        device.token = null;
        return pair().then(function () { return null; });
      }
      if (!r.ok) throw new Error('manifest HTTP ' + r.status);
      return r.json();
    });
  }

  // Aplica giro + espelho num elemento fixo em tela cheia (top:0/left:0).
  function applyOrient(el, rot, mirror) {
    rot = [0, 90, 180, 270].indexOf(rot) >= 0 ? rot : 0;
    var mir = mirror ? ' scaleX(-1)' : '';
    if (rot === 90) {
      el.style.width = '100vh'; el.style.height = '100vw';
      el.style.transformOrigin = 'top left';
      el.style.transform = 'translateX(100vw) rotate(90deg)' + mir;
    } else if (rot === 270) {
      el.style.width = '100vh'; el.style.height = '100vw';
      el.style.transformOrigin = 'top left';
      el.style.transform = 'translateY(100vh) rotate(-90deg)' + mir;
    } else if (rot === 180) {
      el.style.width = '100vw'; el.style.height = '100vh';
      el.style.transformOrigin = 'center';
      el.style.transform = 'rotate(180deg)' + mir;
    } else {
      el.style.width = '100vw'; el.style.height = '100vh';
      el.style.transformOrigin = 'center';
      el.style.transform = mirror ? 'scaleX(-1)' : '';
    }
  }

  function applyManifest(m) {
    if (!m) return;
    var playlistChanged = currentPlaylistId !== (m.playlist ? m.playlist.id : 0);
    currentVersion = m.version;
    currentPlaylistId = m.playlist ? m.playlist.id : 0;
    if (playlistChanged) idx = 0;
    allItems = (m.items || []).slice();
    manifestName = m.playlist ? m.playlist.name : null;
    plRotation = Number(m.rotation) || 0;
    plMirror = m.mirror ? 1 : 0;
    applyOrient(statusEl, plRotation, plMirror);   // tela de status usa o padrao da playlist
    recomputeActive(true);
  }

  // Recalcula o subconjunto no ar agora (day-parting). `force` re-renderiza
  // sempre; senao so quando o conjunto ativo muda.
  function recomputeActive(force) {
    var now = new Date();
    var active = allItems.filter(function (it) { return scheduleActive(it.schedule, now); });
    var sig = active.map(function (it) { return it.id; }).join(',');
    var changed = sig !== activeSig;
    activeSig = sig;
    playlist = active;
    badge.textContent = device.serial + ' · v' + currentVersion + ' · ' +
      active.length + '/' + allItems.length + ' no ar · p' + PLAYER_VERSION;

    if (!allItems.length) {
      idle(manifestName ? 'Playlist "' + manifestName + '" sem itens' : 'Aguardando conteudo');
      return;
    }
    if (!active.length) {
      idle('Nada programado para agora');
      return;
    }
    showStatus(false);
    idx = idx % active.length;
    if (force || changed) render();
  }

  function idle(msg) {
    showStatus(true);
    setStatus(msg, 'Serial: ' + device.serial);
    clearTimeout(advanceTimer);
    cover.classList.remove('on');
    clearStage();
  }

  // 1x1 transparente — poster do <video> sem o "botao de play".
  var BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  var preloadEl = null;

  function clearStage() {
    Array.prototype.slice.call(stage.children).forEach(function (c) {
      try { if (c.tagName === 'VIDEO') { c.pause(); c.removeAttribute('src'); c.load(); } } catch (e) {}
    });
    stage.innerHTML = '';
  }

  // Prebusca o proximo item (aquece o cache de disco do app nativo).
  function preloadNext() {
    if (playlist.length < 2) return;
    var nx = playlist[(idx + 1) % playlist.length];
    if (preloadEl) { try { preloadEl.src = ''; } catch (e) {} }
    preloadEl = nx.type === 'video' ? document.createElement('video') : new Image();
    if (preloadEl.tagName === 'VIDEO') { preloadEl.preload = 'auto'; preloadEl.muted = true; }
    preloadEl.src = API + nx.url;
  }

  var renderSeq = 0;

  function render() {
    clearTimeout(advanceTimer);
    if (!playlist.length) return;
    var mySeq = ++renderSeq;
    var item = playlist[idx];
    var dur = (item.duration || 10) * 1000;
    var loop = playlist.length === 1;

    // orientacao do item (NULL = herda da playlist)
    applyOrient(
      stage,
      item.rotation != null ? Number(item.rotation) : plRotation,
      item.mirror != null ? item.mirror : plMirror
    );

    // preto por cima enquanto o proximo item carrega
    cover.classList.add('on');
    var revealed = false;
    function reveal() {
      if (revealed || mySeq !== renderSeq) return;
      revealed = true;
      cover.classList.remove('on');
    }

    if (item.type === 'video') {
      var v = document.createElement('video');
      v.autoplay = true; v.muted = true; v.playsInline = true; v.controls = false;
      v.preload = 'auto'; v.poster = BLANK;
      v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
      v.loop = loop;
      if (!loop) v.onended = next;
      v.onerror = function () { clearTimeout(advanceTimer); reveal(); advanceTimer = setTimeout(next, 3000); };
      v.oncanplay = function () { v.play().catch(function () {}); };
      v.addEventListener('playing', reveal, { once: true });
      v.onloadedmetadata = function () {
        preloadNext();
        if (loop) return;
        var ms = (v.duration && isFinite(v.duration) ? v.duration : dur / 1000) * 1000 + 700;
        clearTimeout(advanceTimer);
        advanceTimer = setTimeout(next, ms);
      };

      clearStage();
      stage.appendChild(v);
      v.src = API + item.url;
      v.play().catch(function () {});
      setTimeout(reveal, 2500);                 // revela mesmo se 'playing' nao vier
      if (!loop) advanceTimer = setTimeout(next, Math.max(dur, 20000));
    } else if (item.type === 'image' || item.type === 'other' || item.type === 'html') {
      var img = document.createElement('img');
      var imgFail = function () {
        if (mySeq !== renderSeq) return;
        reveal(); clearTimeout(advanceTimer);
        advanceTimer = setTimeout(next, 2000);   // imagem quebrou -> passa pra proxima
      };
      img.onload = function () {
        if (!img.naturalWidth) return imgFail();  // carregou mas nao decodou -> pula
        reveal(); preloadNext();
      };
      img.onerror = imgFail;
      clearStage();
      stage.appendChild(img);
      img.src = API + item.url;
      setTimeout(reveal, 1500);
      advanceTimer = setTimeout(next, dur);
    } else {
      clearStage();
      reveal();
      advanceTimer = setTimeout(next, dur);
    }
  }

  function next() {
    if (!playlist.length) return;
    idx = (idx + 1) % playlist.length;
    render();
  }

  function heartbeat() {
    if (!device.token) return;
    fetch(API + '/api/devices/' + device.id + '/heartbeat', {
      method: 'POST',
      headers: Object.assign({ 'content-type': 'application/json' }, auth()),
      body: JSON.stringify({
        playlist_version: currentVersion < 0 ? 0 : currentVersion,
        capabilities: { userAgent: navigator.userAgent, screen: [screen.width, screen.height] },
      }),
    }).catch(function () {});
  }

  function poll() {
    fetchManifest().then(applyManifest).catch(function (e) {
      badge.textContent = 'erro: ' + e.message;
    });
  }

  function start() {
    serialEl.textContent = device.serial || '…';
    var ready = device.id && device.token
      ? Promise.resolve()
      : pair();

    ready
      .then(function () {
        poll();
        heartbeat();
        setInterval(poll, POLL_MS);
        setInterval(heartbeat, HEARTBEAT_MS);
        // day-parting: reavalia o que esta no ar a cada 20s, sem esperar novo manifest
        setInterval(function () { recomputeActive(false); }, 20000);
      })
      .catch(function (e) {
        setStatus('Falha ao parear', String(e.message || e));
        setTimeout(start, 5000);
      });
  }

  start();
})();
</script>
</body>
</html>
