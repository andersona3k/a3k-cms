<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>A3K Player</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" />
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* orientacao (giro + espelho) aplicada por JS inline em #stage e #status */
  #stage {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    transform-origin: top left;
  }
  #stage > * {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  /* cobre a troca de midia: preto por cima enquanto o proximo item carrega,
     some quando ele comeca a tocar/renderizar. Mata o "botao de play". */
  #cover {
    position: fixed; inset: 0; background: #000; z-index: 5;
    opacity: 0; pointer-events: none; transition: opacity 220ms ease;
  }
  #cover.on { opacity: 1; transition: none; }  /* entra instantaneo, sai suave */
  #status {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    color: #cfd8e3; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px;
    transform-origin: top left; box-sizing: border-box;
  }
  #status .serial {
    font: 700 46px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 8px; color: #fff; background: #111a24;
    border: 1px solid #24384a; border-radius: 14px; padding: 20px 30px;
  }
  #status small { color: #6b7d8f; }
  #status .big { font-size: 19px; color: #e7edf3; max-width: 640px; }
  .hidden { display: none !important; }
  #badge {
    position: fixed; right: 8px; bottom: 6px; color: #33465a;
    font: 11px/1 ui-monospace, monospace; z-index: 10;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="cover"></div>
  <div id="status">
    <div id="statusTitle">A3K Digital Signage</div>
    <div class="serial" id="serial">…</div>
    <div class="big" id="statusMsg">Iniciando…</div>
    <small id="statusHint"></small>
  </div>
  <div id="badge"></div>

<script>
(function () {
  'use strict';

  var PLAYER_VERSION = '2026-08-29.2';
  var API = location.origin;
  var POLL_MS = 15000;
  var HEARTBEAT_MS = 60000;
  var ACT_POLL_MS = 4000;

  var LS = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  var stage = document.getElementById('stage');
  var cover = document.getElementById('cover');
  var statusEl = document.getElementById('status');
  var statusTitle = document.getElementById('statusTitle');
  var serialEl = document.getElementById('serial');
  var statusMsg = document.getElementById('statusMsg');
  var statusHint = document.getElementById('statusHint');
  var badge = document.getElementById('badge');

  function urlParam(name) {
    var m = new RegExp('[?#&]' + name + '=([^&#]+)').exec(location.href);
    return m ? decodeURIComponent(m[1]) : null;
  }

  var device = {
    id: LS.get('a3k_device_id') || null,
    token: LS.get('a3k_token') || null,
    serial: LS.get('a3k_serial') || null,
    hardwareId: LS.get('a3k_hw') || null,
  };

  // Identidade fisica injetada pelo app nativo (?hw=). Tem prioridade sobre o
  // valor salvo: se mudou (ex.: imagem de disco clonada para outro aparelho),
  // descarta a ativacao antiga e ativa de novo com o hw real.
  var injectedHw = urlParam('hw');
  if (injectedHw && injectedHw !== device.hardwareId) {
    LS.set('a3k_device_id', ''); LS.set('a3k_token', ''); LS.set('a3k_serial', '');
    device.id = null; device.token = null; device.serial = null;
    device.hardwareId = injectedHw;
    LS.set('a3k_hw', injectedHw);
  }
  if (!device.hardwareId) {
    device.hardwareId =
      (self.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'hw-' + Date.now() + '-' + Math.random().toString(16).slice(2);
    LS.set('a3k_hw', device.hardwareId);
  }

  var currentVersion = -1;
  var currentPlaylistId = -1;
  var allItems = [];   // tudo que veio no manifest
  var playlist = [];    // subconjunto no ar agora (day-parting)
  var idx = 0;
  var advanceTimer = null;
  var activeSig = '';   // assinatura do subconjunto ativo, p/ detectar mudanca
  var manifestName = null;
  var plRotation = 0, plMirror = 0;   // rotacao do CONTEUDO (playlist)
  var deviceRotation = 0;             // rotacao da TELA (device) — vem no manifest
  function combineRot(base) { return ((deviceRotation + (Number(base) || 0)) % 360 + 360) % 360; }
  var objUrls = [];     // object URLs em uso no #stage (revogados na troca)
  var dlMsg = '';       // progresso do download offline (mostrado no badge)
  var activation = null;
  var actPollTimer = null, expiryTimer = null;

  // ---------------------------------------------------------------- tela cheia
  // O navegador SÓ entra em tela cheia a partir de um gesto do usuário. Então:
  //  - F11: alterna (entra/sai).
  //  - qualquer 1º clique/toque/tecla: entra (uma vez basta; se o usuário sair
  //    com Esc, o próximo clique reentra). Sem gesto nenhum -> não dá; use
  //    `msedge.exe --kiosk <url>` ou instale como app (manifest display:fullscreen).
  function enterFullscreen() {
    try {
      if (document.fullscreenElement) return;
      var el = document.documentElement;
      var rq = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (rq) { var p = rq.call(el); if (p && p.catch) p.catch(function () {}); }
    } catch (e) {}
  }
  function exitFullscreen() {
    try {
      var ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if (document.fullscreenElement && ex) ex.call(document);
    } catch (e) {}
  }
  function toggleFullscreen() {
    if (document.fullscreenElement) exitFullscreen(); else enterFullscreen();
  }
  window.addEventListener('keydown', function (e) {
    if (e.key === 'F11' || e.keyCode === 122) { e.preventDefault(); toggleFullscreen(); return; }
    enterFullscreen();   // qualquer outra tecla também entra
  });
  window.addEventListener('pointerdown', enterFullscreen);   // qualquer clique/toque entra

  // ---------------------------------------------------------------- IndexedDB (offline)
  // Guarda cada asset como Blob (chave = hash sha256, ou a url se nao houver hash)
  // e o ultimo manifest. Funciona em http puro (nao exige secure context).
  var IDB_NAME = 'a3k-player', IDB_VER = 1, _db = null;
  function idb() {
    if (_db) return Promise.resolve(_db);
    return new Promise(function (resolve, reject) {
      if (!self.indexedDB) return reject(new Error('sem IndexedDB'));
      var rq = indexedDB.open(IDB_NAME, IDB_VER);
      rq.onupgradeneeded = function () {
        var d = rq.result;
        if (!d.objectStoreNames.contains('media')) d.createObjectStore('media');
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
      };
      rq.onsuccess = function () { _db = rq.result; resolve(_db); };
      rq.onerror = function () { reject(rq.error); };
    });
  }
  function idbReq(store, mode, fn) {
    return idb().then(function (d) {
      return new Promise(function (resolve, reject) {
        var tx = d.transaction(store, mode);
        var rq = fn(tx.objectStore(store));
        tx.oncomplete = function () { resolve(rq ? rq.result : undefined); };
        tx.onerror = tx.onabort = function () { reject(tx.error); };
      });
    });
  }
  function mediaGet(k) { return idbReq('media', 'readonly', function (s) { return s.get(k); }); }
  function mediaPut(k, v) { return idbReq('media', 'readwrite', function (s) { return s.put(v, k); }); }
  function mediaDel(k) { return idbReq('media', 'readwrite', function (s) { return s.delete(k); }); }
  function mediaKeys() { return idbReq('media', 'readonly', function (s) { return s.getAllKeys(); }); }
  function metaGet(k) { return idbReq('meta', 'readonly', function (s) { return s.get(k); }); }
  function metaPut(k, v) { return idbReq('meta', 'readwrite', function (s) { return s.put(v, k); }); }

  function cacheKey(it) { return it.hash || it.url; }

  // Baixa tudo que falta e apaga o que saiu da playlist.
  function fetchWithTimeout(url, ms) {
    if (typeof AbortController === 'undefined') return fetch(url);
    var ac = new AbortController();
    var t = setTimeout(function () { ac.abort(); }, ms || 60000);
    return fetch(url, { signal: ac.signal }).then(function (r) { clearTimeout(t); return r; },
      function (e) { clearTimeout(t); throw e; });
  }

  function syncMedia(items) {
    var list = (items || []).filter(function (it) { return it && it.url; });
    var keep = {};
    list.forEach(function (it) { keep[cacheKey(it)] = 1; });
    // baixa a partir do PRÓXIMO a tocar (o que está no ar agora está streamando)
    if (playlist.length) {
      var order = [];
      for (var o = 0; o < playlist.length; o++) order.push(playlist[(idx + 1 + o) % playlist.length]);
      list.forEach(function (it) { if (order.indexOf(it) < 0) order.push(it); });
      list = order.filter(function (it) { return it && it.url; });
    }
    var i = 0, retried = false, failed = [];
    function step() {
      if (i >= list.length) {
        if (!retried && failed.length) { retried = true; list = failed.slice(); failed = []; i = 0; return step(); }
        dlMsg = ''; paintBadge();
        return mediaKeys().then(function (all) {
          return Promise.all((all || [])
            .filter(function (k) { return !keep[k]; })
            .map(function (k) { return mediaDel(k).catch(function () {}); }));
        }).catch(function () {});
      }
      var it = list[i++], k = cacheKey(it);
      return mediaGet(k).then(function (hit) {
        if (hit && hit.blob) return step();
        dlMsg = 'baixando ' + i + '/' + list.length;
        paintBadge();
        return fetchWithTimeout(API + it.url, 90000).then(function (r) {
          if (!r.ok) throw new Error('dl ' + r.status);
          return r.blob();
        }).then(function (blob) {
          return mediaPut(k, { blob: blob, mime: it.mime || blob.type, url: it.url, at: Date.now() });
        }).then(step, function () { failed.push(it); return step(); });
      }, function () { return step(); });
    }
    return Promise.resolve().then(step);
  }

  // URL para tocar: do cache (blob) se houver, senao streaming direto.
  function srcFor(it) {
    var k = cacheKey(it);
    return mediaGet(k).then(function (hit) {
      if (hit && hit.blob) {
        var u = URL.createObjectURL(hit.blob);
        objUrls.push(u);
        return u;
      }
      return API + it.url;
    }).catch(function () { return API + it.url; });
  }

  // ---- day-parting: espelha src/lib/schedule.js, avaliado no relogio local ----
  function schedToMinutes(hhmm) {
    var m = /^(\d{1,2}):([0-5]\d)$/.exec(String(hhmm).trim());
    if (!m) return null;
    var h = +m[1], mi = +m[2];
    if (h > 24 || (h === 24 && mi !== 0)) return null;
    return h * 60 + mi;
  }
  function isoDay(d) { return ((d.getDay() + 6) % 7) + 1; }
  function ymd(d) {
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function scheduleActive(s, date) {
    if (s == null) return true;
    if (typeof s === 'string') { try { s = JSON.parse(s); } catch (e) { return true; } if (s == null) return true; }
    var d = date || new Date();
    var day = ymd(d);
    if (s.from && day < String(s.from).slice(0, 10)) return false;
    if (s.until && day > String(s.until).slice(0, 10)) return false;
    var start = s.start ? schedToMinutes(s.start) : 0;
    var end = s.end ? schedToMinutes(s.end) : 1440;
    if (end === 0) end = 1440;
    var now = d.getHours() * 60 + d.getMinutes();
    var days = (s.days && s.days.length) ? s.days : null;
    var today = isoDay(d), yesterday = ((today + 5) % 7) + 1;
    if (start <= end) {
      return (now >= start && now < end) && (!days || days.indexOf(today) >= 0);
    }
    if (now >= start) return !days || days.indexOf(today) >= 0;
    if (now < end) return !days || days.indexOf(yesterday) >= 0;
    return false;
  }

  function detectPlayerType() {
    var ua = navigator.userAgent;
    if (/Tizen/i.test(ua)) return 'tizen';
    if (/Web0S|webOS|LG Browser/i.test(ua)) return 'webos';
    if (/Android/i.test(ua)) return 'android';
    if (/Windows/i.test(ua)) return 'windows';
    return 'unknown';
  }
  function caps() {
    return { userAgent: navigator.userAgent, screen: [screen.width, screen.height], player: PLAYER_VERSION };
  }

  function setStatus(msg, hint) {
    if (/[<>]/.test(msg || '')) statusMsg.innerHTML = msg || '';
    else statusMsg.textContent = msg || '';
    statusHint.textContent = hint || '';
  }
  function showStatus(show) { statusEl.classList.toggle('hidden', !show); }
  function paintBadge() {
    badge.textContent = (device.serial || '(sem serial)') +
      (currentVersion >= 0 ? ' · v' + currentVersion : '') +
      (dlMsg ? ' · ' + dlMsg : '') + ' · p' + PLAYER_VERSION;
  }

  // ---------------------------------------------------------------- ativacao
  function saveDevice(d) {
    device.id = String(d.id);
    device.token = d.token || device.token;
    if (d.serial) device.serial = d.serial;
    LS.set('a3k_device_id', device.id);
    if (device.token) LS.set('a3k_token', device.token);
    if (device.serial) LS.set('a3k_serial', device.serial);
    serialEl.textContent = device.serial || '';
  }

  function stopActivation() {
    clearInterval(actPollTimer); actPollTimer = null;
    clearInterval(expiryTimer); expiryTimer = null;
    activation = null;
  }

  function renderCodeScreen() {
    showStatus(true);
    statusTitle.textContent = 'Ative este player';
    serialEl.textContent = activation.code;
    setStatus(
      'No painel A3K: <b>Playlists &rarr; sua playlist &rarr; &#65291; ativar player</b><br>e informe o c&oacute;digo acima.',
      ''
    );
    clearInterval(expiryTimer);
    expiryTimer = setInterval(tickExpiry, 1000);
    tickExpiry();
  }
  function tickExpiry() {
    var hint = 'Clique p/ tela cheia · F11 alterna';
    if (activation && activation.expiresAt) {
      var end = new Date(String(activation.expiresAt).replace(' ', 'T') + 'Z').getTime();
      var left = Math.max(0, Math.round((end - Date.now()) / 1000));
      var mm = Math.floor(left / 60), ss = left % 60;
      hint = 'expira em ' + mm + ':' + (ss < 10 ? '0' : '') + ss + '  ·  ' + hint;
      if (left <= 0) { stopActivation(); activate(); return; }
    }
    statusHint.textContent = hint;
  }

  // Resolve quando o player tem token (ativado ou re-autenticado).
  function activate() {
    showStatus(true);
    statusTitle.textContent = 'A3K Digital Signage';
    serialEl.textContent = '…';
    setStatus('Ativando…', 'Clique p/ tela cheia · F11 alterna');
    return fetch(API + '/api/activation/new', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ hardware_id: device.hardwareId, player_type: detectPlayerType(), capabilities: caps() }),
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.already_active && d.device && d.device.token) {
          saveDevice(d.device);
          stopActivation();
          return true;
        }
        if (!d || !d.code) throw new Error(d && d.error ? d.error : 'ativacao falhou');
        activation = { code: d.code, pollSecret: d.poll_secret, expiresAt: d.expires_at };
        renderCodeScreen();
        return waitForRedeem();
      })
      .catch(function (e) {
        setStatus('Sem conexao com o servidor', String(e && e.message || e));
        return new Promise(function (resolve) { setTimeout(function () { activate().then(resolve); }, 5000); });
      });
  }

  function waitForRedeem() {
    return new Promise(function (resolve) {
      clearInterval(actPollTimer);
      actPollTimer = setInterval(function () {
        if (!activation) { clearInterval(actPollTimer); return; }
        var u = API + '/api/activation/status?hardware_id=' + encodeURIComponent(device.hardwareId) +
          '&s=' + encodeURIComponent(activation.pollSecret);
        fetch(u)
          .then(function (r) { return r.json().then(function (b) { return { code: r.status, b: b }; }); })
          .then(function (o) {
            if (o.code === 404 || (o.b && o.b.status === 'expired')) {
              stopActivation(); activate().then(resolve); return;
            }
            if (o.b && o.b.status === 'redeemed' && o.b.device) {
              saveDevice(o.b.device);
              stopActivation();
              resolve(true);
            }
          })
          .catch(function () { /* offline: continua tentando */ });
      }, ACT_POLL_MS);
    });
  }

  function auth() { return { authorization: 'Bearer ' + device.token }; }

  function fetchManifest() {
    var url = API + '/api/devices/' + device.id + '/manifest?v=' + currentVersion + '&p=' + currentPlaylistId;
    return fetch(url, { headers: auth() }).then(function (r) {
      if (r.status === 304) return null;
      if (r.status === 401 || r.status === 403) {
        device.token = null; LS.set('a3k_token', '');
        return activate().then(function () { return null; });
      }
      if (!r.ok) throw new Error('manifest HTTP ' + r.status);
      return r.json();
    });
  }

  // Aplica giro + espelho num elemento fixo em tela cheia (top:0/left:0).
  function applyOrient(el, rot, mirror) {
    rot = [0, 90, 180, 270].indexOf(rot) >= 0 ? rot : 0;
    var mir = mirror ? ' scaleX(-1)' : '';
    if (rot === 90) {
      el.style.width = '100vh'; el.style.height = '100vw';
      el.style.transformOrigin = 'top left';
      el.style.transform = 'translateX(100vw) rotate(90deg)' + mir;
    } else if (rot === 270) {
      el.style.width = '100vh'; el.style.height = '100vw';
      el.style.transformOrigin = 'top left';
      el.style.transform = 'translateY(100vh) rotate(-90deg)' + mir;
    } else if (rot === 180) {
      el.style.width = '100vw'; el.style.height = '100vh';
      el.style.transformOrigin = 'center';
      el.style.transform = 'rotate(180deg)' + mir;
    } else {
      el.style.width = '100vw'; el.style.height = '100vh';
      el.style.transformOrigin = 'center';
      el.style.transform = mirror ? 'scaleX(-1)' : '';
    }
  }

  function applyManifest(m) {
    if (!m) return;
    var playlistChanged = currentPlaylistId !== (m.playlist ? m.playlist.id : 0);
    currentVersion = m.version;
    currentPlaylistId = m.playlist ? m.playlist.id : 0;
    if (playlistChanged) idx = 0;
    allItems = (m.items || []).slice();
    manifestName = m.playlist ? m.playlist.name : null;
    plRotation = Number(m.rotation) || 0;
    plMirror = m.mirror ? 1 : 0;
    if (m.deviceRotation != null) deviceRotation = Number(m.deviceRotation) || 0;
    applyOrient(statusEl, combineRot(plRotation), plMirror);
    metaPut('manifest', m).catch(function () {});
    recomputeActive(true);
    syncMedia(allItems).catch(function () {});
  }

  // Recalcula o subconjunto no ar agora (day-parting).
  function recomputeActive(force) {
    var now = new Date();
    var active = allItems.filter(function (it) { return scheduleActive(it.schedule, now); });
    var sig = active.map(function (it) { return it.id; }).join(',');
    var changed = sig !== activeSig;
    activeSig = sig;
    playlist = active;
    badge.textContent = (device.serial || '') + ' · v' + currentVersion + ' · ' +
      active.length + '/' + allItems.length + ' no ar' + (dlMsg ? ' · ' + dlMsg : '') + ' · p' + PLAYER_VERSION;

    if (!allItems.length) {
      idle(manifestName ? 'Playlist "' + manifestName + '" sem itens' : 'Aguardando conteudo');
      return;
    }
    if (!active.length) { idle('Nada programado para agora'); return; }
    showStatus(false);
    idx = idx % active.length;
    if (force || changed) render();
  }

  function idle(msg) {
    showStatus(true);
    statusTitle.textContent = 'A3K Digital Signage';
    setStatus(msg, 'Serial: ' + (device.serial || '—') + '  ·  Clique p/ tela cheia · F11 alterna');
    clearTimeout(advanceTimer);
    cover.classList.remove('on');
    clearStage();
  }

  var BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

  function clearStage() {
    Array.prototype.slice.call(stage.children).forEach(function (c) {
      try { if (c.tagName === 'VIDEO') { c.pause(); c.removeAttribute('src'); c.load(); } } catch (e) {}
    });
    stage.innerHTML = '';
    objUrls.forEach(function (u) { try { URL.revokeObjectURL(u); } catch (e) {} });
    objUrls = [];
  }

  function preloadNext() {
    // com o cache em IndexedDB o proximo item ja foi baixado por syncMedia;
    // so garante que ele esta la (no-op se estiver).
    if (playlist.length < 2) return;
    var nx = playlist[(idx + 1) % playlist.length];
    if (!nx || !nx.url) return;
    mediaGet(cacheKey(nx)).then(function (hit) {
      if (hit && hit.blob) return;
      return fetch(API + nx.url).then(function (r) { return r.ok ? r.blob() : null; })
        .then(function (b) { if (b) return mediaPut(cacheKey(nx), { blob: b, mime: nx.mime || b.type, url: nx.url, at: Date.now() }); });
    }).catch(function () {});
  }

  var renderSeq = 0;
  var _renderFails = 0;   // itens seguidos que não conseguiram tocar

  function render() {
    clearTimeout(advanceTimer);
    if (!playlist.length) return;
    var mySeq = ++renderSeq;
    var item = playlist[idx];
    var dur = (item.duration || 10) * 1000;
    var loop = playlist.length === 1;
    var stallChk = null;

    applyOrient(
      stage,
      combineRot(item.rotation != null ? Number(item.rotation) : plRotation),
      item.mirror != null ? item.mirror : plMirror
    );

    cover.classList.add('on');
    var revealed = false;
    function reveal() {
      if (revealed || mySeq !== renderSeq) return;
      revealed = true;
      _renderFails = 0;
      clearInterval(stallChk);
      cover.classList.remove('on');
    }

    // item não conseguiu aparecer (rede/decodificação): pula pro próximo.
    // Se deu a volta inteira sem nada tocar -> mostra "sem conexão" e re-tenta.
    function fail(reason) {
      if (mySeq !== renderSeq) return;
      clearInterval(stallChk);
      clearTimeout(advanceTimer);
      _renderFails++;
      if (_renderFails >= playlist.length) {
        _renderFails = 0;
        idle('Sem conexão — tentando de novo…');
        advanceTimer = setTimeout(function () { if (playlist.length) render(); }, 8000);
        return;
      }
      advanceTimer = setTimeout(next, 1200);
    }

    if (item.type === 'video') {
      var v = document.createElement('video');
      v.autoplay = true; v.muted = true; v.playsInline = true; v.controls = false;
      v.preload = 'auto'; v.poster = BLANK;
      v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
      v.loop = loop;
      if (!loop) v.onended = next;
      v.onerror = function () { fail('erro no vídeo'); };
      v.oncanplay = function () { v.play().catch(function () {}); };
      v.addEventListener('playing', reveal, { once: true });
      v.onloadedmetadata = function () {
        preloadNext();
        if (loop) return;
        var ms = (v.duration && isFinite(v.duration) ? v.duration : dur / 1000) * 1000 + 700;
        clearTimeout(advanceTimer);
        advanceTimer = setTimeout(next, ms);
      };

      clearStage();
      stage.appendChild(v);
      srcFor(item).then(function (url) {
        if (mySeq !== renderSeq) return;
        v.src = url;
        v.play().catch(function () {});
      });
      // watchdog: 8s sem começar a tocar (readyState<3) -> considera travado
      var stallSecs = 0;
      stallChk = setInterval(function () {
        if (mySeq !== renderSeq || revealed) { clearInterval(stallChk); return; }
        stallSecs++;
        if (stallSecs >= 8 && v.readyState < 3) fail('vídeo travado (rede?)');
      }, 1000);
      if (!loop) advanceTimer = setTimeout(next, Math.max(dur, 20000));
    } else if (item.type === 'image' || item.type === 'other' || item.type === 'html') {
      var img = document.createElement('img');
      img.onload = function () {
        if (!img.naturalWidth) return fail('imagem sem dados');
        reveal(); preloadNext();
      };
      img.onerror = function () { fail('erro na imagem'); };
      clearStage();
      stage.appendChild(img);
      srcFor(item).then(function (url) { if (mySeq === renderSeq) img.src = url; });
      setTimeout(function () { if (mySeq === renderSeq && !revealed) fail('imagem travada'); }, 8000);
      advanceTimer = setTimeout(next, dur);
    } else {
      clearStage();
      reveal();
      advanceTimer = setTimeout(next, dur);
    }
  }

  function next() {
    if (!playlist.length) return;
    idx = (idx + 1) % playlist.length;
    render();
  }

  var _commTimer = null, _commInterval = 60, _shotInterval = 30, _shotTimer = null;

  // retorno do nativo (window.A3K.captureUpload). cmdId numérico -> ack do comando.
  window.__a3kShot = function (cmdId, json) {
    var o = {}; try { o = JSON.parse(json); } catch (e) {}
    if (cmdId && cmdId !== 'auto' && cmdId !== 'null') {
      ackCommand(cmdId, !!o.ok, o.ok ? (o.url || 'capturado') : (o.error || 'falha'));
    } else {
      log('captura automática ' + (o.ok ? 'ok ' + (o.url || '') : 'falhou: ' + (o.error || '')));
    }
  };

  function scheduleAutoShot() {
    clearInterval(_shotTimer);
    if (!device.token || !(window.A3K && window.A3K.captureUpload)) return;
    _shotTimer = setInterval(function () {
      try {
        window.A3K.captureUpload('auto', API + '/api/devices/' + device.id + '/screenshots?source=auto', device.token);
      } catch (e) {}
    }, Math.max(1, _shotInterval) * 60000);
  }

  function heartbeat() {
    if (!device.token) return;
    fetch(API + '/api/devices/' + device.id + '/heartbeat', {
      method: 'POST',
      headers: Object.assign({ 'content-type': 'application/json' }, auth()),
      body: JSON.stringify({
        playlist_version: currentVersion < 0 ? 0 : currentVersion,
        capabilities: caps(),
      }),
    }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (!d) return;
      if (d.comm_interval && d.comm_interval !== _commInterval) { _commInterval = d.comm_interval; scheduleCommLog(); }
      if (d.screenshot_interval && d.screenshot_interval !== _shotInterval) { _shotInterval = d.screenshot_interval; scheduleAutoShot(); }
      if (Array.isArray(d.commands) && d.commands.length) d.commands.forEach(runCommand);
    }).catch(function () {});
  }

  // ---- comandos remotos ----
  function ackCommand(id, ok, result) {
    fetch(API + '/api/devices/' + device.id + '/commands/' + id + '/ack', {
      method: 'POST', headers: Object.assign({ 'content-type': 'application/json' }, auth()),
      body: JSON.stringify({ status: ok ? 'ok' : 'error', result: result == null ? null : String(result) }),
    }).catch(function () {});
  }
  var _cmdDone = {};
  function runCommand(c) {
    if (_cmdDone[c.id]) return;
    _cmdDone[c.id] = 1;
    try {
      if (c.type === 'ping') {
        ackCommand(c.id, true, 'v' + currentVersion + ' · ' + (playlist.length) + '/' + allItems.length + ' no ar');
      } else if (c.type === 'unassign_playlist') {
        ackCommand(c.id, true, 'ok'); poll();
      } else if (c.type === 'restart') {
        ackCommand(c.id, true, 'reiniciando'); setTimeout(function () { location.reload(); }, 800);
      } else if (c.type === 'clear_cache') {
        var done = function (extra) {
          ackCommand(c.id, true, 'cache limpo' + (extra ? ' ' + extra : ''));
          setTimeout(function () { location.reload(); }, 800);
        };
        try { if (window.A3K && window.A3K.clearCache) window.A3K.clearCache(); } catch (e) {}
        if (self.indexedDB) {
          var del = indexedDB.deleteDatabase('a3k-player');
          del.onsuccess = del.onerror = del.onblocked = function () { done('(idb)'); };
        } else { done(''); }
      } else if (c.type === 'screenshot') {
        if (window.A3K && window.A3K.captureUpload) {
          // nativo captura + faz upload; retorna via window.__a3kShot(cmdId, json)
          window.A3K.captureUpload(String(c.id), API + '/api/devices/' + device.id + '/screenshots?source=manual', device.token);
        } else {
          ackCommand(c.id, false, 'captura só no player Android');
        }
      } else {
        ackCommand(c.id, false, 'tipo desconhecido: ' + c.type);
      }
    } catch (e) { ackCommand(c.id, false, e && e.message || 'erro'); }
  }

  // ---- log de comunicação: a cada _commInterval min, 4 tentativas ----
  function scheduleCommLog() {
    clearInterval(_commTimer);
    _commTimer = setInterval(runCommLogCycle, Math.max(1, _commInterval) * 60000);
  }
  function runCommLogCycle() {
    if (!device.token) return;
    var attempts = [];
    var i = 0;
    function one() {
      if (i >= 4) {
        fetch(API + '/api/devices/' + device.id + '/comm-log', {
          method: 'POST', headers: Object.assign({ 'content-type': 'application/json' }, auth()),
          body: JSON.stringify({ at: new Date().toISOString(), attempts: attempts }),
        }).catch(function () {});
        return;
      }
      var n = i + 1, t0 = Date.now();
      fetch(API + '/api/devices/' + device.id + '/comm-check', { headers: auth(), cache: 'no-store' })
        .then(function (r) {
          attempts.push({ n: n, ok: r.ok, ms: Date.now() - t0, detail: r.ok ? ('HTTP ' + r.status) : ('HTTP ' + r.status) });
        })
        .catch(function (e) {
          attempts.push({ n: n, ok: false, ms: Date.now() - t0, detail: (e && e.message) || 'sem rede' });
        })
        .then(function () { i++; setTimeout(one, 400); });
    }
    one();
  }

  function poll() {
    if (!device.token) return;
    fetchManifest().then(applyManifest).catch(function (e) {
      // offline: segue tocando do cache
      badge.textContent = (device.serial || '') + ' · offline · ' + (e && e.message || e) + ' · p' + PLAYER_VERSION;
    });
  }
  // usado pelo F2 do app Android (após girar a tela no servidor): força re-fetch
  window.__a3kPoll = function () { currentVersion = -1; poll(); };
  // F2 do Android: gira a TELA (orientação do device, no servidor) 90° horário
  window.__a3kRotate = function () {
    if (!device.token) return;
    fetch(API + '/api/devices/' + device.id + '/orientation', {
      method: 'POST', headers: Object.assign({ 'content-type': 'application/json' }, auth()),
      body: JSON.stringify({ rotate90: true }),
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.orientation != null) { deviceRotation = Number(d.orientation) || 0; }
      currentVersion = -1; poll();
    }).catch(function () {});
  };

  function start() {
    serialEl.textContent = device.serial || '…';
    paintBadge();

    var ready = (device.id && device.token) ? Promise.resolve(true) : activate();

    ready
      .then(function () {
        showStatus(true);
        statusTitle.textContent = 'A3K Digital Signage';
        setStatus('Carregando…', 'Clique p/ tela cheia · F11 alterna');
        return metaGet('manifest').then(function (m) {
          if (m && !allItems.length) applyManifest(m);   // pinta do cache primeiro
        }).catch(function () {});
      })
      .then(function () {
        poll();
        heartbeat();
        setInterval(poll, POLL_MS);
        setInterval(heartbeat, HEARTBEAT_MS);
        setInterval(function () { recomputeActive(false); }, 20000);
        scheduleCommLog();
        scheduleAutoShot();
        setTimeout(runCommLogCycle, 8000);   // um ciclo logo no início
        window.addEventListener('online', poll);
      })
      .catch(function (e) {
        setStatus('Falha ao iniciar', String(e && e.message || e));
        setTimeout(start, 5000);
      });
  }

  start();
})();
</script>
</body>
</html>
